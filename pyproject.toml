[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robrick-swarm"
version = "0.1.0"
description = "Decentralized swarm self-assembly: identical units build and self-heal target structures from one neighbour-only local rule."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Azra Bano" }]
keywords = ["swarm-robotics", "multi-agent", "self-assembly", "decentralized", "kilobot"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
swarm-assemble = "swarm.cli:main"

[tool.setuptools]
packages = ["swarm"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
